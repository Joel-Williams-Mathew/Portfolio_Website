<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A night sky with the constellation JW and a ringed planet">
  <title>JW constellation over a ringed planet</title>

  <defs>
    <!-- deep space wash -->
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0"    stop-color="#03040f"/>
      <stop offset="0.30" stop-color="#05081a"/>
      <stop offset="0.58" stop-color="#0a0a26"/>
      <stop offset="0.80" stop-color="#0c0a2b"/>
      <stop offset="1"    stop-color="#04050e"/>
    </linearGradient>

    <!-- nebula clouds -->
    <radialGradient id="neb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>

    <!-- the planet, lit from the upper left -->
    <radialGradient id="planetLit" cx="0.32" cy="0.26" r="0.78">
      <stop offset="0"    stop-color="#c4b5fd"/>
      <stop offset="0.22" stop-color="#8b7cf6"/>
      <stop offset="0.48" stop-color="#5b4bd6"/>
      <stop offset="0.74" stop-color="#2d2596"/>
      <stop offset="1"    stop-color="#120c3d"/>
    </radialGradient>

    <!-- terminator shadow: keeps the far side dark -->
    <radialGradient id="planetShade" cx="0.30" cy="0.28" r="0.85">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.82"/>
    </radialGradient>

    <radialGradient id="planetHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1"    stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- star colour variants -->
    <radialGradient id="glowStar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- constellation star halo -->
    <radialGradient id="cstar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#a5f3fc" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="twinkleBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- ===================== SKY ===================== -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- nebula clouds -->
  <ellipse cx="230"  cy="150" rx="420" ry="330" fill="url(#neb1)" filter="url(#haze)"/>
  <ellipse cx="1010" cy="230" rx="380" ry="300" fill="url(#neb2)" filter="url(#haze)"/>
  <ellipse cx="640"  cy="740" rx="460" ry="300" fill="url(#neb3)" filter="url(#haze)"/>

  <!-- ===================== STARFIELD ===================== -->
  <!-- small background stars -->
  <g fill="#ffffff">
    <circle cx="64"   cy="72"  r="1.1"><animate attributeName="opacity" values=".2;.9;.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="152"  cy="188" r="0.8"><animate attributeName="opacity" values=".7;.25;.7" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="240"  cy="54"  r="1.3"><animate attributeName="opacity" values=".3;1;.3" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="318"  cy="246" r="0.9"><animate attributeName="opacity" values=".55;.15;.55" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="402"  cy="96"  r="1.0"><animate attributeName="opacity" values=".25;.95;.25" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="486"  cy="330" r="0.7"><animate attributeName="opacity" values=".6;.2;.6" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="560"  cy="140" r="1.2"><animate attributeName="opacity" values=".35;1;.35" dur="6.1s" repeatCount="indefinite"/></circle>
    <circle cx="648"  cy="404" r="0.8"><animate attributeName="opacity" values=".5;.1;.5" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="726"  cy="70"  r="1.1"><animate attributeName="opacity" values=".28;.88;.28" dur="5.0s" repeatCount="indefinite"/></circle>
    <circle cx="812"  cy="300" r="0.9"><animate attributeName="opacity" values=".65;.2;.65" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="890"  cy="128" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="968"  cy="372" r="0.7"><animate attributeName="opacity" values=".55;.15;.55" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1046" cy="196" r="1.0"><animate attributeName="opacity" values=".4;.95;.4" dur="5.7s" repeatCount="indefinite"/></circle>
    <circle cx="1128" cy="446" r="0.8"><animate attributeName="opacity" values=".5;.12;.5" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="94"  r="1.2"><animate attributeName="opacity" values=".33;.9;.33" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="120"  cy="470" r="0.8"><animate attributeName="opacity" values=".45;.12;.45" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="356"  cy="560" r="1.0"><animate attributeName="opacity" values=".3;.85;.3" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="742"  cy="620" r="0.9"><animate attributeName="opacity" values=".52;.14;.52" dur="4.0s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="580" r="1.1"><animate attributeName="opacity" values=".26;.92;.26" dur="5.9s" repeatCount="indefinite"/></circle>
    <circle cx="530"  cy="700" r="0.8"><animate attributeName="opacity" values=".6;.18;.6" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===================== PLANET ===================== -->
  <g transform="translate(940,600)">
    <!-- halo -->
    <circle r="300" fill="url(#planetHalo)">
      <animate attributeName="r" values="290;312;290" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- ring behind the planet -->
    <g transform="rotate(-22)">
      <ellipse rx="250" ry="62" fill="none" stroke="#a78bfa" stroke-width="1.2" opacity="0.30"/>
      <ellipse rx="216" ry="50" fill="none" stroke="#c4b5fd" stroke-width="0.9" opacity="0.22"/>
      <clipPath id="ringBack"><rect x="-320" y="-200" width="640" height="200"/></clipPath>
      <g clip-path="url(#ringBack)">
        <ellipse rx="250" ry="62" fill="none" stroke="#a78bfa" stroke-width="2.4" opacity="0.45"/>
        <ellipse rx="216" ry="50" fill="none" stroke="#c4b5fd" stroke-width="1.8" opacity="0.34"/>
      </g>
    </g>

    <!-- body -->
    <circle r="150" fill="url(#planetLit)"/>
    <circle r="150" fill="url(#planetShade)"/>

    <!-- surface bands -->
    <g clip-path="url(#planetClip)" opacity="0.5">
      <clipPath id="planetClip"><circle r="150"/></clipPath>
      <ellipse cx="-30" cy="-58" rx="150" ry="15" fill="#e9d5ff" opacity="0.13"/>
      <ellipse cx="20"  cy="-16" rx="140" ry="11" fill="#e9d5ff" opacity="0.10"/>
      <ellipse cx="-16" cy="38"  rx="145" ry="14" fill="#e9d5ff" opacity="0.09"/>
      <ellipse cx="24"  cy="92"  rx="130" ry="10" fill="#e9d5ff" opacity="0.07"/>
    </g>

    <!-- rim light -->
    <circle r="150" fill="none" stroke="#c4b5fd" stroke-width="1.4" opacity="0.42"/>

    <!-- ring in front -->
    <g transform="rotate(-22)">
      <clipPath id="ringFront"><rect x="-320" y="0" width="640" height="200"/></clipPath>
      <g clip-path="url(#ringFront)">
        <ellipse rx="250" ry="62" fill="none" stroke="#a78bfa" stroke-width="2.6" opacity="0.62"/>
        <ellipse rx="216" ry="50" fill="none" stroke="#e9d5ff" stroke-width="1.9" opacity="0.44"/>
      </g>
    </g>
  </g>

  <!-- ===================== CONSTELLATION: J W ===================== -->
  <g>
    <!-- connecting lines, drawn on with a dash animation -->
    <polyline
      points="250,150 250,177 250,204 250,231 250,258 250,279 241,294 226,300 211,295.5 202,282"
      fill="none" stroke="#22d3ee" stroke-width="1.1" opacity="0.5"
      stroke-dasharray="240" stroke-dashoffset="240">
      <animate attributeName="stroke-dashoffset" from="240" to="0"
               dur="2.6s" begin="0.6s" fill="freeze"/>
    </polyline>

    <polyline
      points="450,150 469.5,300 489,195 508.5,300 528,150"
      fill="none" stroke="#22d3ee" stroke-width="1.1" opacity="0.5"
      stroke-dasharray="300" stroke-dashoffset="300">
      <animate attributeName="stroke-dashoffset" from="300" to="0"
               dur="2.4s" begin="2.2s" fill="freeze"/>
    </polyline>

    <!-- J stars -->
    <g>
      <circle cx="250" cy="150" r="9" fill="url(#cstar)"><animate attributeName="r" values="7;11;7" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="150" r="2.6" fill="#e0feff"/>
      <circle cx="250" cy="177" r="6" fill="url(#cstar)" opacity="0.9"><animate attributeName="r" values="4.5;7;4.5" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="177" r="2"   fill="#e0feff"/>
      <circle cx="250" cy="204" r="7" fill="url(#cstar)"><animate attributeName="r" values="5.5;8.5;5.5" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="204" r="2.3" fill="#e0feff"/>
      <circle cx="250" cy="231" r="6" fill="url(#cstar)" opacity="0.9"><animate attributeName="r" values="4.5;7;4.5" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="231" r="2"   fill="#e0feff"/>
      <circle cx="250" cy="258" r="7" fill="url(#cstar)"><animate attributeName="r" values="5.5;8.5;5.5" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="258" r="2.3" fill="#e0feff"/>
      <circle cx="250" cy="279" r="6" fill="url(#cstar)" opacity="0.9"><animate attributeName="r" values="4.5;7;4.5" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="279" r="2"   fill="#e0feff"/>
      <circle cx="241" cy="294" r="7" fill="url(#cstar)"><animate attributeName="r" values="5.5;8.5;5.5" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="241" cy="294" r="2.3" fill="#e0feff"/>
      <circle cx="226" cy="300" r="10" fill="url(#cstar)"><animate attributeName="r" values="8;12;8" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="226" cy="300" r="3"   fill="#ffffff"/>
      <circle cx="211" cy="295.5" r="6" fill="url(#cstar)" opacity="0.9"><animate attributeName="r" values="4.5;7;4.5" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="211" cy="295.5" r="2" fill="#e0feff"/>
      <circle cx="202" cy="282" r="7" fill="url(#cstar)"><animate attributeName="r" values="5.5;8.5;5.5" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="202" cy="282" r="2.3" fill="#e0feff"/>
    </g>

    <!-- W stars -->
    <g>
      <circle cx="450"   cy="150" r="9" fill="url(#cstar)"><animate attributeName="r" values="7;11;7" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="450"   cy="150" r="2.6" fill="#e0feff"/>
      <circle cx="469.5" cy="300" r="10" fill="url(#cstar)"><animate attributeName="r" values="8;12;8" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="469.5" cy="300" r="3"   fill="#ffffff"/>
      <circle cx="489"   cy="195" r="7" fill="url(#cstar)"><animate attributeName="r" values="5.5;8.5;5.5" dur="3.0s" repeatCount="indefinite"/></circle>
      <circle cx="489"   cy="195" r="2.3" fill="#e0feff"/>
      <circle cx="508.5" cy="300" r="10" fill="url(#cstar)"><animate attributeName="r" values="8;12;8" dur="5.0s" repeatCount="indefinite"/></circle>
      <circle cx="508.5" cy="300" r="3"   fill="#ffffff"/>
      <circle cx="528"   cy="150" r="9" fill="url(#cstar)"><animate attributeName="r" values="7;11;7" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="528"   cy="150" r="2.6" fill="#e0feff"/>
    </g>

    <!-- travelling spark that walks the constellation -->
    <circle r="3.4" fill="#a5f3fc" filter="url(#twinkleBlur)">
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto"
        path="M250,150 L250,177 L250,204 L250,231 L250,258 L250,279 L241,294 L226,300 L211,295.5 L202,282
              M450,150 L469.5,300 L489,195 L508.5,300 L528,150"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.88;1"
               dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===================== SATELLITE ===================== -->
  <g opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 46,-30; 0,0" dur="30s" repeatCount="indefinite"/>
      <g transform="translate(120,520) rotate(-14)">
        <rect x="-11" y="-8" width="22" height="16" rx="3"
              fill="#d9d6f0" stroke="#9a95c4" stroke-width="0.8"/>
        <rect x="-46" y="-7" width="32" height="14" rx="2"
              fill="#1d4ed8" stroke="#60a5fa" stroke-width="0.7"/>
        <rect x="14"  y="-7" width="32" height="14" rx="2"
              fill="#1d4ed8" stroke="#60a5fa" stroke-width="0.7"/>
        <line x1="-46" y1="-2.3" x2="-14" y2="-2.3" stroke="#60a5fa" stroke-width="0.5" opacity="0.7"/>
        <line x1="-46" y1="2.3"  x2="-14" y2="2.3"  stroke="#60a5fa" stroke-width="0.5" opacity="0.7"/>
        <line x1="14"  y1="-2.3" x2="46"  y2="-2.3" stroke="#60a5fa" stroke-width="0.5" opacity="0.7"/>
        <line x1="14"  y1="2.3"  x2="46"  y2="2.3"  stroke="#60a5fa" stroke-width="0.5" opacity="0.7"/>
        <path d="M -4,-14 L 4,-14 L 2,-22 L -2,-22 Z" fill="#c4b5fd" opacity="0.9"/>
        <circle cx="0" cy="-24" r="2.4" fill="#22d3ee">
          <animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- ===================== SHOOTING STARS ===================== -->
  <g>
    <line x1="0" y1="0" x2="-62" y2="24" stroke="#ffffff" stroke-width="1.4" opacity="0">
      <animate attributeName="opacity" values="0;.9;0" dur="6s" begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="1150,60; 420,330" dur="6s" begin="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="-52" y2="20" stroke="#ffffff" stroke-width="1.2" opacity="0">
      <animate attributeName="opacity" values="0;.85;0" dur="8s" begin="5.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="820,120; 180,470" dur="8s" begin="5.2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="-46" y2="18" stroke="#a5f3fc" stroke-width="1.1" opacity="0">
      <animate attributeName="opacity" values="0;.8;0" dur="11s" begin="8.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="400,40; -60,300" dur="11s" begin="8.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- faint ground silhouette so the bottom of the page has a horizon -->
  <path d="M0,800 L0,742 C 120,724 210,760 320,748 C 430,736 520,700 640,716
           C 760,732 860,762 980,750 C 1090,739 1160,752 1200,744 L1200,800 Z"
        fill="#03040c" opacity="0.85"/>
</svg>
