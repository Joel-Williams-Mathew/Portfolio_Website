name: Update view count

# Fetches the portfolio view count and commits it to views.json so the site can
# read it from its own origin (no CORS, no iframe, cannot be blocked).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-views
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch count
        run: |
          URL="https://hits.sh/joel-williams-mathew.github.io/Portfolio_Website.svg"
          for i in 1 2 3; do
            if curl -sSL --max-time 25 -H 'Cache-Control: no-cache' "$URL" -o badge.svg; then
              if [ -s badge.svg ]; then break; fi
            fi
            echo "attempt $i failed, retrying..."
            sleep 3
          done
          echo "badge size: $(wc -c < badge.svg) bytes"

      - name: Parse count
        id: parse
        run: |
          python3 scripts/parse_views.py badge.svg >> "$GITHUB_OUTPUT"
          echo "--- output ---"
          cat "$GITHUB_OUTPUT"

      - name: Write views.json
        if: steps.parse.outputs.count != ''
        run: |
          python3 scripts/write_views.py "${{ steps.parse.outputs.count }}"
          cat views.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views.json
          if git diff --staged --quiet; then
            echo "no change - nothing to commit"
          else
            git commit -m "chore: update view count"
            git pull --rebase origin main
            git push
          fi
