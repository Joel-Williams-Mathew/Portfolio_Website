name: Update view count

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # diagnostics first - always succeeds, writes what we need to debug
      - name: Diagnose
        if: always()
        run: |
          {
            echo "date: $(date -u)"
            echo "python3: $(python3 --version 2>&1 || echo MISSING)"
            echo "pwd: $(pwd)"
            echo "ls: $(ls -la)"
            echo "scripts dir: $(ls -la scripts 2>&1 || echo MISSING)"
            echo "views.json: $(cat views.json 2>&1 || echo MISSING)"
          } > diagnosis.txt
          cat diagnosis.txt

      - name: Run updater
        id: updater
        continue-on-error: true
        run: python3 scripts/update_views.py > updater.log 2>&1

      - name: Show updater output
        if: always()
        run: |
          echo "=== updater.log ==="
          cat updater.log 2>&1 || echo "no log produced"
          echo "=== views.json after ==="
          cat views.json 2>&1 || echo "missing"

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views.json updater.log diagnosis.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "debug: view count run [skip ci]" || true
            git pull --rebase origin main || true
            git push || echo "push failed"
          fi
